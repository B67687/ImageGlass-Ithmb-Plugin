# ci.yml — Build + clippy + security advisory + package .igplugin.zip artifacts.
name: ci
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request: { branches: [main] }
permissions: { contents: read }

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            pkg_tag: linux
          - os: macos-latest
            pkg_tag: macos
          - os: windows-latest
            pkg_tag: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: true
          cache-key: "plugin-rust-${{ matrix.os }}"
      - name: Build
        run: cargo build --release
      - name: Verify symbol export
        shell: bash
        if: runner.os != 'Windows'
        run: |
          LIB="$(ls target/release/libithmb_core_cabi.so target/release/libithmb_core_cabi.dylib 2>/dev/null | head -n 1)"
          if [ -n "$LIB" ]; then
            nm -D "$LIB" 2>/dev/null | grep -q ig_plugin_get_api && echo "Symbol verified" || echo "Missing symbol!"
          fi
      - name: Package .igplugin.zip
        id: package
        shell: bash
        run: |
          bash scripts/package.sh "${{ matrix.pkg_tag }}"
          echo "artifact-name=ithmb-codec-${{ matrix.pkg_tag }}.igplugin.zip" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ithmb-codec-${{ matrix.pkg_tag }}.igplugin.zip
          path: dist/*.igplugin.zip
  verify_clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: clippy
          cache: true
          cache-key: "plugin-clippy"
      - name: cargo clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

  verify_deny:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: true
          cache-key: "plugin-deny"
      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ithmb-codec-*
          merge-multiple: true
      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "ImageGlass-Ithmb-Plugin ${{ github.ref_name }}" \
            --notes-file CHANGELOG.md \
            *.igplugin.zip
        env:
          GH_TOKEN: ${{ github.token }}
